name: build & release 
# 手动触发：输入版本号 → 打 tag → 构建 → 创建 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0，不要加 v 前缀）"
        required: true
        type: string

jobs:
  # ---- 第一步：打 tag ----
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 创建并推送 tag
        id: tag
        run: |
          TAG="v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ---- 第二步：构建并发布 ----
  build-and-release:
    needs: create-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建扩展
        run: pnpm build

      - name: 打包为 zip
        run: |
          cd dist
          zip -r ../yi-dian-dian.zip .

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          name: ${{ needs.create-tag.outputs.tag }}
          files: yi-dian-dian.zip
          generate_release_notes: true
