name: 构建并发布扩展包

# 当推送 v* 格式的 tag 时自动触发

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建扩展
        run: pnpm build

      - name: 打包为 zip
        run: |
          cd dist
          zip -r ../yi-dian-dian-${{ github.ref_name }}.zip .

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: yi-dian-dian-${{ github.ref_name }}.zip
          generate_release_notes: true
